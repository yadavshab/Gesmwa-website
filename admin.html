<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEWA — Article Publisher</title>
    <style>
        :root {
            --bg-base: #000000;
            --card-bg: #0a0a0c;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-focus: rgba(255, 255, 255, 0.3);
            --text-main: #f3f4f6;
            --text-muted: #8e94a0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 50% -20%, rgba(255, 255, 255, 0.05) 0%, transparent 60%),
                radial-gradient(circle at 100% 100%, rgba(10, 10, 12, 1) 0%, transparent 50%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
            padding: 24px;
        }

        .box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 36px 32px;
            border-radius: 20px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9);
        }

        h2 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #ffffff;
            text-align: center;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        input, textarea {
            width: 100%;
            margin-bottom: 18px;
            padding: 12px 16px;
            background: #000000;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: all 0.25s ease;
        }

        input:focus, textarea:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.08);
        }

        button {
            width: 100%;
            padding: 12px;
            background: #ffffff;
            border: none;
            color: #000000;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(255, 255, 255, 0.15);
        }

        button:hover {
            background: #e4e4e7;
            transform: translateY(-1px);
        }

        .back-link {
            text-align: center;
            margin-bottom: 16px;
        }

        .back-link a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 12px;
            font-weight: 500;
        }

        .back-link a:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="box">
        <div class="back-link">
            <a href="admin.html">&larr; Back to Dashboard</a>
        </div>
        
        <h2>📝 नया आर्टिकल लिखें</h2>
        
        <label>आर्टिकल का टाइटल</label>
        <input type="text" id="title" placeholder="यहाँ टाइटल दर्ज करें..." />
        
        <label>कंटेंट विवरण</label>
        <textarea id="content" rows="6" placeholder="यहाँ अपने आर्टिकल की पूरी जानकारी लिखें..."></textarea>
        
        <button onclick="saveArticle()">आर्टिकल पब्लिश करें</button>
    </div>

    <script>
        // यह फंक्शन Render लाइव बैकएंड को डेटा भेजेगा
        async function saveArticle() {
            const title = document.getElementById('title').value.trim();
            const content = document.getElementById('content').value.trim();
            const username = sessionStorage.getItem("username") || "mayank";

            if (!title || !content) {
                alert("कृपया टाइटल और कंटेंट दोनों भरें!");
                return;
            }

            try {
                // लाइव रेंडर बैकएंड URL पर डेटा भेजना
                const response = await fetch('https://gewa-backend-live.onrender.com/api/articles', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: title, content: content, username: username })
                });

                const data = await response.json();
                
                if (response.ok && (data.success !== false)) {
                    alert(data.message || "🎉 आर्टिकल सफलतापूर्वक पब्लिश हो गया है!");
                    document.getElementById('title').value = '';
                    document.getElementById('content').value = '';
                } else {
                    throw new Error(data.message || "आर्टिकल सेव करने में असफल!");
                }
            } catch (error) {
                alert("त्रुटि: सर्वर से कनेक्ट नहीं हो पा रहा है। कृपया पुनः प्रयास करें।");
                console.error("Publish error:", error);
            }
        }
    </script>

</body>
</html>
