<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEWA - Secure Admin Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-100 text-slate-800 flex items-center justify-center min-h-screen relative overflow-hidden">
    
    <div class="absolute top-0 left-0 w-full h-80 bg-slate-900 rounded-b-[100px] z-0 shadow-xl"></div>

    <div class="w-full max-w-md bg-white p-8 md:p-10 rounded-3xl shadow-2xl z-10 mx-4 border border-slate-200">
        
        <div class="text-center mb-8">
            <div class="w-20 h-20 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center text-4xl mx-auto mb-4 shadow-inner border-4 border-white outline outline-blue-100">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h1 class="text-2xl font-black text-slate-900 uppercase tracking-tight">Admin Portal</h1>
            <p class="text-sm text-slate-500 font-medium mt-1">Secure Authentication Required</p>
        </div>

        <form action="#" method="POST" class="space-y-5">
            <!-- Custom Password Login -->
            <div>
                <div class="relative">
                    <i class="fa-solid fa-user absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="adminId" placeholder="Admin ID / Username" class="w-full bg-slate-50 border border-slate-200 text-slate-900 text-sm rounded-xl block pl-11 p-3.5 outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>
            <div>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                    <input type="password" id="adminPwd" placeholder="Custom Password" class="w-full bg-slate-50 border border-slate-200 text-slate-900 text-sm rounded-xl block pl-11 p-3.5 outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>
            
            <div class="flex items-center justify-between text-xs font-bold">
                <a href="#" onclick="alert('Password reset link will be sent to registered email.')" class="text-blue-600 hover:text-blue-800 transition"><i class="fa-solid fa-key"></i> Forgot Password?</a>
            </div>

            <button type="button" onclick="window.location.href='admin-dashboard.html'" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black uppercase tracking-widest text-sm py-3.5 rounded-xl shadow-lg transition duration-300 flex justify-center items-center gap-2">
                Login with Password <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <!-- OR Divider -->
        <div class="flex items-center my-6">
            <div class="flex-grow border-t border-slate-200"></div>
            <span class="px-4 text-xs font-bold text-slate-400 uppercase">Or Most Secure</span>
            <div class="flex-grow border-t border-slate-200"></div>
        </div>

        <!-- Smart Logins (Google & OTP) -->
        <div class="space-y-3">
            <button type="button" onclick="window.location.href='admin-dashboard.html'" class="w-full border-2 border-slate-200 hover:bg-slate-50 text-slate-700 font-extrabold text-sm py-3 rounded-xl transition duration-300 flex justify-center items-center gap-3">
                <img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png" class="w-5 h-5" alt="Google"> Login with Google
            </button>

            <button type="button" onclick="window.location.href='admin-dashboard.html'" class="w-full border-2 border-emerald-200 bg-emerald-50 hover:bg-emerald-100 text-emerald-800 font-extrabold text-sm py-3 rounded-xl transition duration-300 flex justify-center items-center gap-3">
                <i class="fa-solid fa-mobile-screen-button text-lg"></i> Login with Phone (OTP)
            </button>
        </div>

        <!-- Back to Home -->
        <div class="mt-6 text-center pt-4">
            <a href="index.html" class="text-xs font-bold text-slate-500 hover:text-slate-900 transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-house-flag"></i> Back to Homepage
            </a>
        </div>
    </div>
</body>
</html>
