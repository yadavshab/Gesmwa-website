<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEWA Enterprise &mdash; Secure Admin Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #000000;
            --card-bg: #0a0a0c;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-focus: rgba(255, 255, 255, 0.3);
            --text-main: #f3f4f6;
            --text-muted: #8e94a0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 50% -20%, rgba(255, 255, 255, 0.05) 0%, transparent 60%),
                radial-gradient(circle at 100% 100%, rgba(10, 10, 12, 1) 0%, transparent 50%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
            overflow-x: hidden;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            padding: 24px;
            position: relative;
        }

        .auth-card-glow {
            position: absolute;
            inset: 20px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.01));
            filter: blur(40px);
            z-index: -1;
            border-radius: 24px;
        }

        .auth-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 36px 32px;
            border-radius: 20px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9);
        }

        .brand-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 24px;
        }

        .brand-logo {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .system-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
            color: #a1a1aa;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
        }

        .auth-tabs {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            background: #000000;
            border: 1px solid var(--border-color);
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 24px;
            gap: 4px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 600;
            padding: 8px 4px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: #ffffff;
            color: #000000;
            box-shadow: 0 2px 8px rgba(255, 255, 255, 0.15);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 12px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .input-wrapper {
            position: relative;
        }

        .input-field {
            width: 100%;
            padding: 12px 16px 12px 42px;
            background: #000000;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 14px;
            color: #ffffff;
            outline: none;
            transition: all 0.25s ease;
        }

        .input-field::placeholder {
            color: #52525b;
        }

        .input-field:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.08);
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #71717a;
            width: 18px;
            height: 18px;
            pointer-events: none;
        }

        .otp-row {
            display: flex;
            gap: 8px;
        }

        .otp-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-color);
            color: #ffffff;
            padding: 0 14px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s;
        }

        .otp-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #ffffff;
            border: none;
            color: #000000;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(255, 255, 255, 0.15);
            margin-top: 6px;
        }

        .submit-btn:hover {
            background: #e4e4e7;
            transform: translateY(-1px);
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .status-banner {
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            text-align: center;
            display: none;
            font-weight: 500;
        }

        .status-banner.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #f87171;
        }

        .status-banner.success {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }

        .status-banner.loading {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #a1a1aa;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .footer-meta {
            text-align: center;
            margin-top: 24px;
            color: #52525b;
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="auth-card-glow"></div>
    <div class="auth-card">
        <!-- Back to Homepage Link -->
        <div style="text-align: center; margin-bottom: 16px;">
            <a href="index.html" style="color: #a1a1aa; text-decoration: none; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; transition: color 0.2s;">
                &larr; Back to Homepage
            </a>
        </div>

        <div class="brand-section">
            <div class="brand-logo">GEWA Enterprise</div>
            <div class="system-badge">
                <div class="status-dot"></div> Secure Gateway
            </div>
        </div>

        <div class="auth-tabs">
            <button type="button" class="tab-btn active" onclick="switchTab('username')">Username & Pass</button>
            <button type="button" class="tab-btn" onclick="switchTab('mobile-otp')">Mobile & OTP</button>
        </div>

        <!-- Anti-Autofill Dummy Elements -->
        <input type="text" style="display:none;" name="prevent_autofill_1">
        <input type="password" style="display:none;" name="prevent_autofill_2">

        <form id="loginForm" autocomplete="off">
            <!-- TAB 1: Username & Password -->
            <div id="tab-username" class="tab-content active">
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        <input type="text" id="box_u" class="input-field" placeholder="Enter ID" readonly onfocus="this.removeAttribute('readonly');" autocomplete="off">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                        <input type="password" id="box_p" class="input-field" placeholder="Enter secret key" readonly onfocus="this.removeAttribute('readonly');" autocomplete="new-password">
                    </div>
                </div>
            </div>

            <!-- TAB 2: Mobile & OTP -->
            <div id="tab-mobile-otp" class="tab-content">
                <div class="form-group">
                    <label class="form-label">Admin Mobile Number</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                        <input type="text" id="box_m" class="input-field" placeholder="Enter 10-digit mobile (e.g. 8395972715)" readonly onfocus="this.removeAttribute('readonly');" autocomplete="off">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Secure OTP Code</label>
                    <div class="otp-row">
                        <div class="input-wrapper" style="flex: 1;">
                            <svg class="input-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path></svg>
                            <input type="text" id="box_o" class="input-field" maxlength="6" placeholder="Enter code" autocomplete="off">
                        </div>
                        <button type="button" class="otp-btn" onclick="requestOtp()">Get OTP</button>
                    </div>
                </div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Authenticate Session</button>
            
            <div id="statusBanner" class="status-banner"></div>
        </form>
    </div>

    <div class="footer-meta">
        Authorized Access Only &bull; GEWA &copy; 2026
    </div>
</div>

<script>
    let currentMode = 'username';

    function clearAllInputs() {
        document.getElementById('box_u').value = '';
        document.getElementById('box_p').value = '';
        document.getElementById('box_m').value = '';
        document.getElementById('box_o').value = '';
    }

    window.addEventListener('DOMContentLoaded', () => {
        clearAllInputs();
        setTimeout(clearAllInputs, 100);
        setTimeout(clearAllInputs, 500);
    });

    function switchTab(mode) {
        currentMode = mode;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
        
        event.currentTarget.classList.add('active');
        document.getElementById(`tab-${mode}`).classList.add('active');
        document.getElementById('statusBanner').style.display = 'none';
        clearAllInputs();
    }

    async function requestOtp() {
        const mobile = document.getElementById('box_m').value.trim();
        const statusBanner = document.getElementById('statusBanner');

        if (!mobile) {
            alert("Please enter the admin mobile number first.");
            return;
        }

        statusBanner.className = "status-banner loading";
        statusBanner.innerHTML = `<div class="spinner"></div> Sending SMS OTP...`;
        statusBanner.style.display = "flex";

        try {
            const response = await fetch('https://gewa-backend-live.onrender.com/api/admin/send-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ mobile })
            });

            const data = await response.json();
            if (response.ok && data.success) {
                statusBanner.className = "status-banner success";
                statusBanner.style.display = "block";
                statusBanner.innerHTML = "OTP sent successfully to your mobile phone!";
            } else {
                throw new Error(data.message || "Failed to send OTP");
            }
        } catch (err) {
            statusBanner.className = "status-banner error";
            statusBanner.style.display = "block";
            statusBanner.innerHTML = err.message;
        }
    }

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const statusBanner = document.getElementById('statusBanner');
        const submitBtn = document.getElementById('submitBtn');

        statusBanner.className = "status-banner loading";
        statusBanner.innerHTML = `<div class="spinner"></div> Authenticating credentials...`;
        statusBanner.style.display = "flex";
        submitBtn.disabled = true;

        try {
            let endpoint = '';
            let payload = {};

            if (currentMode === 'username') {
                endpoint = 'https://gewa-backend-live.onrender.com/api/admin/login';
                payload = {
                    username: document.getElementById('box_u').value.trim(),
                    password: document.getElementById('box_p').value.trim()
                };
            } else if (currentMode === 'mobile-otp') {
                endpoint = 'https://gewa-backend-live.onrender.com/api/admin/verify-otp';
                payload = {
                    mobile: document.getElementById('box_m').value.trim(),
                    otp: document.getElementById('box_o').value.trim()
                };
            }

            const response = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (response.ok && data.success) {
                statusBanner.style.display = "none";
                sessionStorage.setItem("adminLoggedIn", "true");
                sessionStorage.setItem("userRole", data.role);
                sessionStorage.setItem("username", data.username);
                window.location.replace("admin-dashboard.html");
            } else {
                throw new Error(data.message || "Authentication failed!");
            }
        } catch(err) {
            statusBanner.className = "status-banner error";
            statusBanner.style.display = "block";
            statusBanner.innerHTML = err.message || "Network handshake failure!";
            submitBtn.disabled = false;
        }
    });
</script>

</body>
</html>
