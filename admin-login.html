<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEWA - Secure Login Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; }</style>
</head>
<body class="flex items-center justify-center min-h-screen text-slate-800">

    <div class="bg-white p-8 rounded-[2rem] shadow-2xl w-full max-w-md border border-slate-100">
        <div class="text-center mb-8">
            <div class="w-14 h-14 bg-slate-900 text-white rounded-2xl flex items-center justify-center text-2xl mx-auto mb-3 shadow-lg">
                <i class="fa-solid fa-shield-halved text-amber-400"></i>
            </div>
            <h1 class="text-2xl font-black text-slate-900">GEWA Central Auth</h1>
            <p class="text-xs text-slate-500 font-bold mt-1">Admin & Guest Secure Gateway</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-1">Username</label>
                <input type="text" id="username" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3.5 text-sm font-bold outline-none focus:ring-2 focus:ring-blue-600" required>
            </div>
            <div>
                <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-1">Password</label>
                <input type="password" id="password" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3.5 text-sm font-bold outline-none focus:ring-2 focus:ring-blue-600" required>
            </div>
            <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-black text-xs uppercase tracking-widest py-4 rounded-xl shadow-lg transition">
                Secure Login
            </button>
        </form>

        <div class="mt-6 text-center border-t border-slate-100 pt-4">
            <p class="text-xs text-slate-500 font-medium">Need temporary viewing access?</p>
            <button onclick="requestGuestAccess()" class="text-blue-600 font-bold text-xs mt-1 hover:underline">Request Guest Access</button>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('https://gewa-backend.onrender.com/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();

                if (data.success) {
                    sessionStorage.setItem("adminLoggedIn", "true");
                    sessionStorage.setItem("userRole", data.role); // 'admin' या 'guest'
                    sessionStorage.setItem("username", data.username);
                    window.location.replace("admin-dashboard.html");
                } else {
                    alert(data.message || "Login Failed!");
                }
            } catch(err) {
                alert("Network error connecting to backend!");
            }
        });

        async function requestGuestAccess() {
            const username = prompt("Enter desired Guest Username:");
            const email = prompt("Enter your Email for verification:");
            const password = prompt("Set a temporary password:");

            if(username && email && password) {
                const res = await fetch('https://gewa-backend.onrender.com/api/admin/request-guest', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });
                const data = await res.json();
                alert(data.message);
            }
        }
    </script>
</body>
</html>
